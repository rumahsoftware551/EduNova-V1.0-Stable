server {

    listen 80;

    server_name _;


    root /usr/share/nginx/html;

    index index.html;


    charset utf-8;


    location / {

        try_files $uri $uri/ /index.html;

    }


    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff|woff2|ttf)$ {

        expires 7d;

        add_header Cache-Control "public";

        try_files $uri =404;

    }


    location = /health {

        access_log off;

        add_header Content-Type text/plain;

        return 200 "OK";

    }

}