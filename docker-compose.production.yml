name: edunova

services:

  db:
    image: postgres:18-alpine
    container_name: edunova-db
    restart: unless-stopped

    env_file:
      - .env.production

    volumes:
      - edunova_db:/var/lib/postgresql/data

    networks:
      - edunova_internal

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s


  redis:
    image: redis:8-alpine
    container_name: edunova-redis
    restart: unless-stopped

    env_file:
      - .env.production

    command:
      - sh
      - -lc
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"

    volumes:
      - edunova_redis:/data

    networks:
      - edunova_internal

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s


  backend:
    container_name: edunova-backend

    build:
      context: .
      dockerfile: docker/php/Dockerfile.production

    restart: unless-stopped

    env_file:
      - .env.production

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

    volumes:
      - edunova_storage:/var/www/html/storage/app/public
      - edunova_logs:/var/www/html/storage/logs

    networks:
      - edunova_internal

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sS --max-time 3 -o /dev/null http://127.0.0.1/ || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s


  frontend:
    container_name: edunova-frontend

    build:
      context: .
      dockerfile: docker/frontend/Dockerfile.production
      args:
        VITE_API_ORIGIN: /api

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - edunova_internal


  nginx:
    image: nginx:1.29-alpine
    container_name: edunova-nginx
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      backend:
        condition: service_healthy

      frontend:
        condition: service_started

    volumes:
      - ./docker/nginx-host.conf.template:/etc/nginx/templates/default.conf.template:ro
      - edunova_storage:/var/www/html/storage/app/public:ro

    networks:
      - edunova_internal


volumes:

  edunova_db:
    name: edunova_db

  edunova_redis:
    name: edunova_redis

  edunova_storage:
    name: edunova_storage

  edunova_logs:
    name: edunova_logs


networks:

  edunova_internal:
    name: edunova_internal
    driver: bridge