name: edunova

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - edunova_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - edunova_internal

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    command: ["sh", "-lc", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - edunova_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - edunova_internal

  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.production
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - edunova_storage:/var/www/html/storage/app/public
      - edunova_logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/api/v1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - edunova_internal

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile.production
      args:
        VITE_API_ORIGIN: ""
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edunova_internal

networks:
  edunova_internal:
    driver: bridge

volumes:
  edunova_pgdata:
  edunova_redis:
  edunova_storage:
  edunova_logs:
